<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacto QuestPass CR para patrocinadores y participantes.">
  <title>Contacto | QuestPass CR</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">QuestPass <span>CR</span></a>
      <nav class="site-nav" aria-label="Principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="experiencias.html">Experiencias</a></li>
          <li><a href="reservar.html">Reservar</a></li>
          <li><a href="contacto.html" aria-current="page">Contacto</a></li>
          <li><a href="login.html">Acceso admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido-principal">
    <h1>Contacto</h1>
    <p class="lead">Escríbenos para alianzas con patrocinadores, consultas de participantes o soporte sobre una reserva.</p>

    <form class="form-panel" action="#" method="get">
      <div class="form-group">
        <label for="nombre-contacto">Nombre</label>
        <input type="text" id="nombre-contacto" name="nombre" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="correo-contacto">Correo electrónico</label>
        <input type="email" id="correo-contacto" name="correo" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" name="asunto" required maxlength="120">
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Enviar mensaje</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 QuestPass CR.</p>
      <p><a href="index.html">Inicio</a></p>
    </div>
  </footer>
</body>
</html>
